<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR.js + A-Frame Dual Marker Tracking</title>
  <!-- A-Frame Core Library -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- AR.js A-Frame Build (Marker + Location-based) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0px; overflow: hidden;">
  <!-- Embedded AR Scene with debug UI disabled -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Marker 1: Hiro Marker Configuration -->
    <a-marker preset="hiro">
      <a-entity position="0 0 0" scale="0.05 0.05 0.05"
        gltf-model="https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/scene.gltf"></a-entity>
    </a-marker>

    <!-- Marker 2: Kanji Marker Configuration-->
    <a-marker preset="kanji">
      <a-entity position="0 0 0" scale="0.05 0.05 0.05"
        gltf-model="https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/scene.gltf"></a-entity>
    </a-marker>

    <!-- AR Camera Entity -->
    <a-entity camera></a-entity>
  </a-scene>
</body>

</html>
